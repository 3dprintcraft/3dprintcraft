<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Model Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0d0f12;
    --bg-1: #14171c;
    --bg-2: #1c2128;
    --line: #2a313b;
    --line-soft: #232932;
    --text: #e8ecf1;
    --text-dim: #8b95a3;
    --text-faint: #5b6573;
    --accent: #ff7a18;
    --accent-2: #ffb347;
    --accent-glow: rgba(255, 122, 24, 0.35);
    --good: #4ade80;
    --radius: 14px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--text);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app { position: fixed; inset: 0; }

  #viewport { position: absolute; inset: 0; }
  #viewport canvas { display: block; outline: none; }

  /* ambient gradient + grain over the canvas vignette */
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(120% 90% at 50% 8%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 26px;
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 13px; pointer-events: auto; }
  .brand .mark {
    width: 38px; height: 38px; flex: none; position: relative;
    display: grid; place-items: center;
    border: 1.5px solid var(--accent);
    border-radius: 11px;
    box-shadow: 0 0 22px var(--accent-glow), inset 0 0 14px rgba(255,122,24,0.12);
  }
  .brand .mark svg { width: 20px; height: 20px; }
  .brand .txt h1 {
    font-size: 14px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.1;
  }
  .brand .txt span {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .parttag {
    pointer-events: auto;
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.04em; line-height: 1.6;
  }
  .parttag b { color: var(--text); font-weight: 700; }
  .parttag .muted { color: var(--text-faint); }

  /* ---------- Model switch (top center) ---------- */
  .modelswitch {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: flex; gap: 4px; padding: 4px;
    background: rgba(20,23,28,0.72);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(14px);
  }
  .modelswitch button {
    appearance: none; border: 0; cursor: pointer;
    font-family: "Manrope", sans-serif; font-weight: 700; font-size: 12.5px;
    color: var(--text-dim);
    padding: 9px 17px; border-radius: 9px;
    background: transparent; transition: color 0.2s, background 0.25s var(--ease);
    letter-spacing: 0.01em; white-space: nowrap;
  }
  .modelswitch button:hover { color: var(--text); }
  .modelswitch button.active {
    color: #1a1206;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  /* ---------- Bottom dock ---------- */
  .dock {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: stretch; gap: 8px;
    padding: 9px;
    background: rgba(20,23,28,0.74);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    max-width: calc(100vw - 32px);
  }
  .tool {
    appearance: none; cursor: pointer; border: 1px solid transparent;
    background: var(--bg-2);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 0 14px; height: 44px;
    display: flex; align-items: center; gap: 8px;
    font-family: "Manrope", sans-serif; font-weight: 600; font-size: 12.5px;
    transition: all 0.2s var(--ease);
    white-space: nowrap;
  }
  .tool svg { width: 17px; height: 17px; flex: none; }
  .tool:hover { color: var(--text); border-color: var(--line); transform: translateY(-1px); }
  .tool.on {
    color: var(--accent-2); border-color: rgba(255,122,24,0.45);
    background: rgba(255,122,24,0.10);
  }
  .tool .label { line-height: 1; }

  .divider { width: 1px; background: var(--line-soft); margin: 6px 2px; }

  /* filament swatches */
  .swatches { display: flex; align-items: center; gap: 7px; padding: 0 8px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.14);
    transition: transform 0.18s var(--ease), border-color 0.18s;
    position: relative;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.12); }

  /* ---------- hint (bottom-left) ---------- */
  .hint {
    position: absolute; left: 26px; bottom: 28px; z-index: 5;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: var(--text-faint); letter-spacing: 0.03em; line-height: 1.9;
    pointer-events: none;
  }
  .hint kbd {
    font-family: inherit; color: var(--text-dim);
    background: var(--bg-2); border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 1px 6px; font-size: 10px;
  }

  /* dimensions readout (bottom-right) */
  .dims {
    position: absolute; right: 26px; bottom: 28px; z-index: 5;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: var(--text-faint); letter-spacing: 0.03em; text-align: right; line-height: 1.9;
    pointer-events: none;
  }
  .dims b { color: var(--accent-2); font-weight: 500; }

  /* ---------- loading ---------- */
  .loader {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    background: radial-gradient(120% 120% at 50% 40%, var(--bg-1), var(--bg-0));
    transition: opacity 0.6s var(--ease), visibility 0.6s;
  }
  .loader.hide { opacity: 0; visibility: hidden; }
  .loader .ring {
    width: 58px; height: 58px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader .lbl {
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    color: var(--text-dim); letter-spacing: 0.16em; text-transform: uppercase;
  }
  .loader .bar { width: 220px; height: 3px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
  .loader .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.2s; }
  .loader .pct { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--text-faint); }

  /* entrance for chrome */
  .fade-in { animation: fadeUp 0.7s var(--ease) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .modelswitch.fade-in { animation: fadeDown 0.7s var(--ease) both; }
  @keyframes fadeDown { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .dock.fade-in { animation: fadeUpC 0.7s 0.1s var(--ease) both; }
  @keyframes fadeUpC { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 720px) {
    .parttag, .hint, .dims { display: none; }
    .dock { flex-wrap: wrap; justify-content: center; bottom: 14px; gap: 6px; padding: 8px; }
    .tool .label { display: none; }
    .tool { padding: 0 12px; }
    .swatches { padding: 0 4px; }
    .modelswitch button { padding: 8px 13px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport"></div>
  <div class="vignette"></div>

  <!-- top bar -->
  <header class="topbar">
    <div class="brand fade-in">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 12v10"/>
        </svg>
      </div>
      <div class="txt">
        <h1>3DPrintCraft</h1>
        <span>Model Preview</span>
      </div>
    </div>
    <div class="parttag fade-in">
      <div><b>CBR 1000F</b>Side Fairing</div>
      <div class="muted">Side Panel Covers · STL</div>
    </div>
  </header>

  <!-- model switch -->
  <nav class="modelswitch fade-in" id="switch">
    <button data-model="L" class="active">Αριστερό</button>
    <button data-model="R">Δεξί</button>
    <button data-model="BOTH">Και τα δύο</button>
  </nav>

  <!-- bottom dock -->
  <div class="dock fade-in">
    <button class="tool" id="btn-rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg>
      <span class="label">Αυτόματη περιστροφή</span>
    </button>
    <button class="tool" id="btn-wire">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7v10l10 5 10-5V7z"/><path d="M2 7l10 5 10-5M12 12v10M7 4.5v9.7M17 4.5v9.7"/></svg>
      <span class="label">Πλέγμα</span>
    </button>
    <button class="tool" id="btn-reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="label">Επαναφορά</span>
    </button>

    <div class="divider"></div>

    <div class="swatches" id="swatches" title="Χρώμα υλικού"></div>
  </div>

  <!-- hints -->
  <div class="hint fade-in">
    <div><kbd>Σύρετε</kbd> περιστροφή</div>
    <div><kbd>Κύλιση</kbd> ζουμ &nbsp;·&nbsp; <kbd>Δεξί κλικ</kbd> μετακίνηση</div>
  </div>
  <div class="dims fade-in" id="dims"></div>

  <!-- loader -->
  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="lbl">Φόρτωση μοντέλου</div>
    <div class="pct" id="pct">0%</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const MODELS = {
  L: "models/CBR1000f_SC24_kapje_L.stl",
  R: "models/CBR1000f_SC24_kapje_R.stl",
};

const FILAMENTS = [
  { name: "Ανθρακί",   color: "#2b2f36" },
  { name: "Πορτοκαλί", color: "#ff7a18" },
  { name: "Κόκκινο",   color: "#c8332b" },
  { name: "Ασημί",     color: "#b9c0c9" },
  { name: "Λευκό",     color: "#eef1f4" },
];

const viewport = document.getElementById("viewport");

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0d0f12");
scene.fog = new THREE.Fog("#0d0f12", 600, 1400);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 5000);
camera.position.set(180, 130, 260);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.9;
controls.minDistance = 30;
controls.maxDistance = 1600;
controls.autoRotateSpeed = 2.0;

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfd3ff, 0x202428, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(0.6, 1.0, 0.7).multiplyScalar(300);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 1.2;
scene.add(key);

const rim = new THREE.DirectionalLight(0xff9a4d, 1.1);
rim.position.set(-0.8, 0.4, -0.6).multiplyScalar(300);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x88a0ff, 0.5);
fill.position.set(-0.4, 0.2, 0.9).multiplyScalar(300);
scene.add(fill);

// ---------- ground + grid (sized after model loads) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(2000, 60, 0x2a313b, 0x1b2027);
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

// ---------- material ----------
let currentColor = new THREE.Color(FILAMENTS[0].color);
const material = new THREE.MeshStandardMaterial({
  color: currentColor.clone(),
  metalness: 0.15,
  roughness: 0.55,
  envMapIntensity: 0.9,
  flatShading: false,
});
let wireframe = false;

// ---------- model handling ----------
const loader = new STLLoader();
const cache = {};           // key -> centered geometry + size
const group = new THREE.Group();
scene.add(group);
let currentMode = "L";

function loadGeometry(key, onProgress) {
  if (cache[key]) return Promise.resolve(cache[key]);
  return new Promise((resolve, reject) => {
    loader.load(MODELS[key], (geo) => {
      geo.computeVertexNormals();
      geo.computeBoundingBox();
      const c = new THREE.Vector3();
      geo.boundingBox.getCenter(c);
      geo.translate(-c.x, -c.y, -c.z);            // center at origin
      geo.computeBoundingBox();
      const size = new THREE.Vector3();
      geo.boundingBox.getSize(size);
      cache[key] = { geo, size };
      resolve(cache[key]);
    }, onProgress, reject);
  });
}

function clearGroup() {
  for (const child of [...group.children]) {
    group.remove(child);
    child.geometry = null; // geometries are cached & reused, don't dispose
  }
}

function makeMesh(geo) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// orient the part so its largest face lies flat-ish and stands upright on the grid
function frameScene() {
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);

  // drop the group so it rests on the grid (y = 0)
  group.position.y -= box.min.y;

  // recompute after move
  const box2 = new THREE.Box3().setFromObject(group);
  const c2 = new THREE.Vector3(); box2.getCenter(c2);

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.5;

  controls.target.copy(c2);
  const dir = new THREE.Vector3(0.7, 0.55, 1).normalize();
  camera.position.copy(c2).addScaledVector(dir, dist);
  controls.minDistance = maxDim * 0.25;
  controls.maxDistance = maxDim * 8;
  controls.update();

  // size grid/ground to model footprint
  const gridSize = Math.ceil(maxDim * 3 / 100) * 100;
  grid.scale.setScalar(gridSize / 2000);
  key.shadow.camera.left = -maxDim; key.shadow.camera.right = maxDim;
  key.shadow.camera.top = maxDim; key.shadow.camera.bottom = -maxDim;
  key.shadow.camera.near = 1; key.shadow.camera.far = maxDim * 6;
  key.shadow.camera.updateProjectionMatrix();

  // dimensions readout (assume STL units = mm)
  document.getElementById("dims").innerHTML =
    `ΔΙΑΣΤΑΣΕΙΣ (mm)<br><b>${size.x.toFixed(0)}</b> × <b>${size.y.toFixed(0)}</b> × <b>${size.z.toFixed(0)}</b>`;
}

async function showModel(mode, animate = true) {
  currentMode = mode;
  const keys = mode === "BOTH" ? ["L", "R"] : [mode];

  // ensure geometries loaded
  for (const k of keys) await loadGeometry(k);

  clearGroup();

  if (mode === "BOTH") {
    const a = cache.L, b = cache.R;
    const gap = Math.max(a.size.x, b.size.x) * 0.12;
    const mL = makeMesh(a.geo); mL.position.x = -(a.size.x / 2 + gap / 2);
    const mR = makeMesh(b.geo); mR.position.x =  (b.size.x / 2 + gap / 2);
    group.add(mL, mR);
  } else {
    group.add(makeMesh(cache[mode].geo));
  }
  group.position.set(0, 0, 0);
  frameScene();
}

// ---------- UI wiring ----------
const switchEl = document.getElementById("switch");
switchEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  [...switchEl.children].forEach((b) => b.classList.toggle("active", b === btn));
  showModel(btn.dataset.model);
});

const btnRotate = document.getElementById("btn-rotate");
btnRotate.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle("on", controls.autoRotate);
});

const btnWire = document.getElementById("btn-wire");
btnWire.addEventListener("click", () => {
  wireframe = !wireframe;
  material.wireframe = wireframe;
  btnWire.classList.toggle("on", wireframe);
});

document.getElementById("btn-reset").addEventListener("click", () => {
  controls.autoRotate = false;
  btnRotate.classList.remove("on");
  frameScene();
});

// filament swatches
const swEl = document.getElementById("swatches");
FILAMENTS.forEach((f, i) => {
  const s = document.createElement("div");
  s.className = "swatch" + (i === 0 ? " active" : "");
  s.style.background = f.color;
  s.title = f.name;
  s.addEventListener("click", () => {
    [...swEl.children].forEach((c) => c.classList.remove("active"));
    s.classList.add("active");
    material.color.set(f.color);
    // slightly darker filaments read better a touch rougher
    const lum = new THREE.Color(f.color).getHSL({}).l;
    material.roughness = 0.45 + (1 - lum) * 0.2;
  });
  swEl.appendChild(s);
});

// ---------- progress / boot ----------
const loaderEl = document.getElementById("loader");
const barEl = document.getElementById("bar");
const pctEl = document.getElementById("pct");

function setProgress(p) {
  const v = Math.max(0, Math.min(100, Math.round(p)));
  barEl.style.width = v + "%";
  pctEl.textContent = v + "%";
}

async function boot() {
  // load the default (Left) with progress, then reveal
  await loadGeometry("L", (e) => {
    if (e.lengthComputable) setProgress((e.loaded / e.total) * 100);
    else setProgress(Math.min(95, (e.loaded / 14257784) * 100));
  });
  setProgress(100);
  await showModel("L", false);
  // a couple frames so first render is ready before fade
  requestAnimationFrame(() => requestAnimationFrame(() => loaderEl.classList.add("hide")));
}
boot();

// ---------- render loop ----------
function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
