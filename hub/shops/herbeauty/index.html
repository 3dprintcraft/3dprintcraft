<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerBeauty - Ομορφιά & Ευεξία</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap');

        :root {
            --bronze: #B8935E;
            --bronze-dark: #8B6F47;
            --bronze-light: #D4B896;
            --pink: #E4C5D8;
            --dark: #1a1a1a;
            --light: #FAFAFA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f5e6f0 0%, #E4C5D8 50%, #d4b5c8 100%);
            color: var(--dark);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(184, 147, 94, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(228, 197, 216, 0.3) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Floating particles */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(3px 3px at 20% 30%, rgba(184, 147, 94, 0.5), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(184, 147, 94, 0.4), transparent),
                radial-gradient(2px 2px at 50% 50%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(2px 2px at 80% 10%, rgba(184, 147, 94, 0.5), transparent);
            background-size: 200% 200%;
            animation: sparkle 20s linear infinite;
            z-index: 0;
        }

        @keyframes sparkle {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 80px 20px 60px;
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto 30px;
            position: relative;
        }

        /* Glowing backdrop effect */
        .logo-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(184, 147, 94, 0.3) 0%, transparent 70%);
            filter: blur(40px);
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        .logo {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(184, 147, 94, 0.6));
            animation: logoFloat 6s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* SVG fill color */
        .logo path,
        .logo polygon,
        .logo rect,
        .logo circle,
        .logo ellipse,
        .logo text {
            fill: var(--bronze);
            transition: all 0.4s ease;
        }

        .logo-container:hover .logo path,
        .logo-container:hover .logo polygon,
        .logo-container:hover .logo rect,
        .logo-container:hover .logo circle,
        .logo-container:hover .logo ellipse,
        .logo-container:hover .logo text {
            fill: var(--bronze-light);
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--bronze-dark);
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
            text-shadow: 0 2px 10px rgba(184, 147, 94, 0.3);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Social Links - Modern Card Design */
        .social-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 60px 0;
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 25px 35px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(184, 147, 94, 0.4);
            border-radius: 16px;
            color: var(--dark);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(184, 147, 94, 0.15);
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(184, 147, 94, 0.2), transparent);
            transition: left 0.6s;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            background: rgba(184, 147, 94, 0.9);
            border-color: var(--bronze-dark);
            color: white;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 60px rgba(184, 147, 94, 0.4);
        }

        .social-icon {
            font-size: 1.8rem;
            transition: transform 0.3s ease;
        }

        .social-link:hover .social-icon {
            transform: scale(1.2) rotate(5deg);
        }

        /* Location Section */
        .location-section {
            padding: 60px 0 40px;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.7s both;
        }

        .location-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--bronze-dark);
            margin-bottom: 20px;
            text-shadow: 0 2px 20px rgba(184, 147, 94, 0.3);
        }

        .address {
            font-size: 1.2rem;
            color: rgba(26, 26, 26, 0.75);
            margin-bottom: 40px;
            line-height: 1.8;
            font-weight: 400;
        }

        .map-container {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(184, 147, 94, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(184, 147, 94, 0.2);
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .map-container:hover {
            transform: scale(1.01);
        }

        .map-container iframe {
            width: 100%;
            height: 450px;
            border: none;
            filter: grayscale(0.3) contrast(1.1);
        }

        /* Sticky Footer - Ultra Modern */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-top: 2px solid rgba(184, 147, 94, 0.3);
            box-shadow: 0 -10px 40px rgba(184, 147, 94, 0.2);
            z-index: 1000;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1s both;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .cta-button {
            display: block;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 50px;
            background: linear-gradient(135deg, var(--bronze-dark) 0%, var(--bronze) 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 60px;
            border: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            letter-spacing: 0.05em;
            box-shadow: 
                0 10px 40px rgba(184, 147, 94, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 20px 60px rgba(184, 147, 94, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .cta-button:active {
            transform: translateY(-1px) scale(1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-container {
                max-width: 350px;
            }

            .tagline {
                font-size: 0.9rem;
                letter-spacing: 0.3em;
            }

            .social-links {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 40px 0;
            }

            .location-title {
                font-size: 2rem;
            }

            .map-container iframe {
                height: 350px;
            }

            .cta-button {
                font-size: 1.1rem;
                padding: 18px 40px;
            }

            header {
                padding: 60px 20px 40px;
            }
        }

        @media (max-width: 480px) {
            .logo-container {
                max-width: 280px;
            }

            .container {
                padding: 0 20px;
            }

            .location-title {
                font-size: 1.6rem;
            }

            .map-container iframe {
                height: 300px;
            }
        }
    </style>
</head>
